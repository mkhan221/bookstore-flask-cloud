<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aryan's Book Shelf</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your custom CSS (to override Bootstrap if needed) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">📚 Aryan's Book Shelf</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="darkModeToggle">🌙 Dark Mode</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">

    <!-- Page Title -->
    <h1 class="text-center mb-4">Book Reviews</h1>

    <!-- Add Book Form -->
    <div id="addBook" class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add a Book</h2>
        <div class="row g-2">
          <div class="col-md-3">
            <input type="text" id="title" class="form-control" placeholder="Book Title">
          </div>
          <div class="col-md-3">
            <input type="text" id="author" class="form-control" placeholder="Author Name">
          </div>
          <div class="col-md-3">
            <input type="text" id="publicationYear" class="form-control" placeholder="Publication Year">
          </div>
          <div class="col-md-3">
            <input type="text" id="imageUrl" class="form-control" placeholder="Image URL">
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-primary" onclick="addBook()">Add</button>
          <button id="showBooksButton" class="btn btn-success ms-2" onclick="showAllBooks()">Show All Books</button>
        </div>
      </div>
    </div>

    <!-- Search Section (Step 3 will make it functional) -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Search Books</h2>
        <div class="input-group">
          <input id="searchInput" type="text" class="form-control" placeholder="Search by title or author">
          <button id="searchButton" class="btn btn-outline-primary" onclick="searchBooks()">Search</button>
          <button id="clearSearchButton" class="btn btn-outline-secondary" onclick="clearSearch()">Clear</button>
        </div>
      </div>
    </div>

    <!-- Recently Added Books -->
    <div id="bookList" class="row gy-3">
      <!-- JS will display “Added Successfully” preview here -->
    </div>

    <!-- Book Shelf Grid -->
    <div id="allbooks" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
      <!-- JS will fill with cards -->
    </div>

    <!-- Reviews Section -->
    <section class="reviews-section mt-5">
     <h2 class="text-center mb-4">📖 User Reviews</h2>
     <div id="reviewsList" class="reviews-grid"></div>
    </section>


  </div>

  <!-- Bootstrap JS Bundle (navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your custom script -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
